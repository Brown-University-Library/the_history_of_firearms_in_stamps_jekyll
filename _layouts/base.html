{% include baseurl.html %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="{{ site.keywords | join: ", " | escape_once }}">
  <meta name="description" content="{{ description | escape_once }}">
  <meta name="text-scale" content="scale">
  <title>
      {{ site.title }}
  </title>
  <link rel="stylesheet" href="{{ baseurl }}/css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/flexmasonry/dist/flexmasonry.css">
  <script src="{{baseurl}}/js/flexmasonry.js"></script>
</head>
<body id="fullstamps">
  {{ content | pants}}
</body>
</html>
